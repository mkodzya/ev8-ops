<title>EV8 Ops Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#fbfbfb;--surface:#FFFFFF;--surface-2:#f3f6f3;--ink:#0b0b0b;--muted:#5d6b5d;--line:#dbe4de;--line-soft:#e9efea;
  --accent:#557553;--accent-ink:#557553;--accent-soft:#e3ebe3;--on-accent:#FFFFFF;--brand:#819481;--lime:#e0ffa2;
  --warn:#e45e22;--warn-soft:#fdeadf;--crit:#c8402f;--crit-soft:#f9e3df;--info:#3f74d6;--info-soft:#e4ecfb;
  --rail:#0b0b0b;--rail-ink:#c9d3c9;--rail-active:#1b211b;--rail-accent:#e0ffa2;
  --shadow:0 12px 40px rgba(11,11,11,.16);
  --display:"Be Vietnam Pro","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b;--surface:#151915;--surface-2:#1b211b;--ink:#eef1ee;--muted:#9fae9f;--line:#2a332b;--line-soft:#222a23;
  --accent:#a2b9a2;--accent-ink:#bfd3bf;--accent-soft:#1f2d20;--on-accent:#0b0b0b;--brand:#a2b9a2;--lime:#e0ffa2;
  --warn:#ff7a3d;--warn-soft:#3a2214;--crit:#ef6b5a;--crit-soft:#3d1e1a;--info:#7fa6ee;--info-soft:#1b2a45;
  --rail:#050605;--rail-ink:#aeb9ae;--rail-active:#161a16;--rail-accent:#e0ffa2;
  --shadow:0 12px 40px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#0b0b0b;--surface:#151915;--surface-2:#1b211b;--ink:#eef1ee;--muted:#9fae9f;--line:#2a332b;--line-soft:#222a23;
  --accent:#a2b9a2;--accent-ink:#bfd3bf;--accent-soft:#1f2d20;--on-accent:#0b0b0b;--brand:#a2b9a2;--lime:#e0ffa2;
  --warn:#ff7a3d;--warn-soft:#3a2214;--crit:#ef6b5a;--crit-soft:#3d1e1a;--info:#7fa6ee;--info-soft:#1b2a45;
  --rail:#050605;--rail-ink:#aeb9ae;--rail-active:#161a16;--rail-accent:#e0ffa2;
  --shadow:0 12px 40px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .mark{display:flex;align-items:center}.brand .mark svg{width:96px;height:24px}
.brand b{font-family:var(--display);font-weight:800;color:#fff;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--rail-ink);opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;width:100%;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--rail-ink)}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:var(--rail-active);color:#fff}
.nav button.on{background:var(--rail-active);color:var(--rail-accent);box-shadow:inset 3px 0 0 var(--rail-accent)}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--rail-ink);opacity:.8}
.nav .cnt.hot{color:#FFB4A8;opacity:1}
.rail .who{margin-top:auto;padding:10px;border-top:1px solid #1F2A24;font-size:12px;line-height:1.35}
.rail .who b{color:#fff;display:block;font-family:var(--display)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:260px}
.search input{border:0;background:none;font:inherit;color:inherit;width:100%;outline:none}
.search svg{width:16px;height:16px;color:var(--muted)}
.demo-tag{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px;white-space:nowrap}
.content{padding:22px 26px 60px;display:flex;flex-direction:column;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile .k{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.tile .d{font-size:12px;color:var(--muted)}
.tile.crit .v{color:var(--crit)}
.tile.warn .v{color:var(--warn)}
.tile.ok .v{color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>h3{margin:0;padding:12px 16px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.card>h3 span{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px}
.card .empty{padding:18px 16px;color:var(--muted);font-size:13.5px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 16px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%;align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;grid-column:1}
.row .s{font-size:12.5px;color:var(--muted);grid-column:1}
.row .r{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap}
.row .r.crit{color:var(--crit)}
.row .r.warn{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-family:var(--display);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .n{color:inherit;opacity:.7}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.btn{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(.95)}
.btn svg{width:15px;height:15px}
.tblw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
td.mono{font-family:var(--mono);font-size:12.5px}
td.wrap{white-space:normal;min-width:180px}
.vin{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
.vin b{color:var(--accent-ink);font-weight:500}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.available{background:var(--accent-soft);color:var(--accent-ink)}
.st.rented{background:var(--info-soft);color:var(--info)}
.st.service{background:var(--warn-soft);color:var(--warn)}
.st.out,.st.crit,.st.churn{background:var(--crit-soft);color:var(--crit)}
.st.sold,.st.returned,.st.paused{background:var(--line-soft);color:var(--muted)}
.st.active{background:var(--accent-soft);color:var(--accent-ink)}
.st.overdue{background:var(--crit-soft);color:var(--crit)}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--line-soft);color:var(--muted);margin-right:4px}
.muted{color:var(--muted)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 16px 14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.fleetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.vcard:hover{border-color:var(--accent)}
.vcard .m{font-family:var(--display);font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vcard .m small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.vcard .who{font-size:12.5px;color:var(--muted);min-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .18s ease-out;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dh h2{margin:2px 0 4px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.2}
.dh .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.dh .x:hover{background:var(--surface-2);color:var(--ink)}
.db{padding:16px 20px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-variant-numeric:tabular-nums}
.sec h4{margin:0 0 8px;font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px;padding-left:14px;gap:10px}
.tl>div{position:relative;font-size:13.5px}
.tl>div::before{content:"";position:absolute;left:-20px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tl>div.ok::before{background:var(--accent)}
.tl>div.bad::before{background:var(--crit)}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.periods{display:flex;flex-direction:column;gap:4px}
.period{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;background:var(--surface-2);font-size:13px}
.period .n{font-family:var(--mono);font-size:12px}
.period.bad{background:var(--crit-soft)}
.period.bad .n,.period.bad .money{color:var(--crit)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.ok{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-family:var(--display);font-weight:600;font-size:13.5px;opacity:0;transition:all .18s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.msgtpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msgtpl h4{margin:0;font-family:var(--display);font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.bubble{background:var(--accent-soft);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13.5px;max-width:420px;white-space:pre-line}
.bubble.ge{font-size:13px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:25;pointer-events:none}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,92vw);padding:22px 24px;opacity:0;transform:translateY(8px);transition:all .15s}
.modal.on{pointer-events:auto}.modal.on .box{opacity:1;transform:none}
.modal h2{margin:0 0 6px;font-family:var(--display);font-size:19px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);margin:14px 0;font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:12.5px}
.steps div{background:var(--surface-2);border-radius:8px;padding:10px}
.steps b{display:block;font-family:var(--display);font-size:12px;margin-bottom:3px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;overflow-x:auto}
  .brand,.rail .who{display:none}
  .nav{flex-direction:row;gap:2px;width:100%}
  .nav button{flex-direction:column;gap:3px;padding:6px 4px;font-size:10.5px;flex:1;min-width:58px;justify-content:center;text-align:center}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--rail-accent)}
  .nav .cnt{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .search{min-width:0;width:100%;order:3}
  .content{padding:14px 14px 90px}
  .steps{grid-template-columns:1fr}
}

.bake{display:flex;flex-direction:column;gap:18px;padding:8px 0 28px;border-bottom:1px solid var(--line)}
.bake-h{font-family:var(--display);font-weight:800;font-size:22px;margin:22px 0 0;letter-spacing:-.01em;display:flex;gap:12px;align-items:baseline}
.bake-h small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.drawer.static{position:static;transform:none;height:auto;width:100%;box-shadow:none;border:1px solid var(--line);border-radius:12px}
.drawer.static .db{padding-bottom:20px}
.bake-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start}
</style>

    <div class="who"><b>Kardu Kukhianidze</b>директор · 13.09.2026</div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="title">Сегодня</h1><div class="sub" id="subtitle"></div></div>
      <span class="demo-tag">Демо · данные Odoo 13.09.2026</span>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="VIN, клиент, номер аренды…" aria-label="Поиск"></label>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const DATA = __DATA__;
const TODAY = new Date(DATA.summary.today + "T12:00:00");
const fmt = n => (Math.round(n*100)/100).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₾";
const fmt0 = n => Math.round(n).toLocaleString("ru-RU") + " ₾";
const dd = s => { if(!s) return "—"; const [y,m,d]=s.slice(0,10).split("-"); return `${d}.${m}.${y}`; };
const days = (a,b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000);
const short = n => (n||"").split("/").pop().trim();
const vinHtml = v => v ? `<span class="vin">${v.slice(0,13)}<b>${v.slice(13)}</b></span>` : `<span class="muted">VIN не подтверждён</span>`;
const ST = {available:"Свободен",rented:"В аренде",service:"В сервисе",out:"Списан",sold:"Продан",active:"Активна",returned:"Завершена",paused:"На паузе",churn:"Спорная",overdue:"Просрочка"};
const st = (s,label) => `<span class="st ${s}">${label||ST[s]||s}</span>`;
const byId = {}; DATA.rentals.forEach(r=>byId[r.id]=r);
const vByVin = {}; DATA.vehicles.forEach(v=>vByVin[v.vin]=v);
const cById = {}; DATA.customers.forEach(c=>cById[c.id]=c);
const active = DATA.rentals.filter(r=>r.status==="active");
const overdue = active.filter(r=>r.residual>0.05).sort((a,b)=>b.residual-a.residual);
const noVin = active.filter(r=>!r.vin);
const inService = DATA.vehicles.filter(v=>v.status==="service");
const custPays = DATA.payments.filter(p=>p.type==="inbound");
const unmatchedNote = 48; // из журнала: поступления эквайринга без имени плательщика (checklist 14.08.2026)

const NAV = [
  ["today","Сегодня",'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', null],
  ["fleet","Парк",'<circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M7 14l3-7h5l2 4h-4"/>', DATA.vehicles.length],
  ["rentals","Аренды",'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', active.length],
  ["payments","Платежи",'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/>', unmatchedNote, true],
  ["customers","Клиенты",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', DATA.customers.filter(c=>!c.supplier).length],
  ["sales","Продажи",'<path d="M3 3h2l2 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>', DATA.sales.length],
  ["service","Сервис",'<path d="M14 6a4 4 0 0 0-5.5 5.5L3 17l4 4 5.5-5.5A4 4 0 0 0 18 10l-3 3-2-2 3-3z"/>', inService.length],
  ["messages","Сообщения",'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/>', null],
];
let view = "today", filters = {fleet:{status:null,model:null}, rentals:"active", payments:"all"};
const $ = s => document.querySelector(s);
const toast = t => { const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),2600); };
const demoAct = t => toast(`${t} — в демо действие не выполняется`);

function renderNav(){
  $("#nav").innerHTML = NAV.map(([k,l,ic,c,hot])=>`<button class="${view===k?"on":""}" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><span>${l}</span>${c!=null?`<span class="cnt ${hot?"hot":""}">${c}</span>`:""}</button>`).join("");
}
function go(v){ view=v; renderNav(); render(); window.scrollTo({top:0}); }
document.addEventListener("click", e=>{
  const nb = e.target.closest("[data-v]"); if(nb){ go(nb.dataset.v); return; }
  const op = e.target.closest("[data-open]"); if(op){ openDrawer(op.dataset.open, op.dataset.id); return; }
  const f = e.target.closest("[data-f]"); if(f){ const [k,v]=f.dataset.f.split(":"); if(k==="status"||k==="model"){ filters.fleet[k] = filters.fleet[k]===v?null:v; } else filters[k]=v; render(); return; }
  const a = e.target.closest("[data-act]"); if(a){ if(a.dataset.act==="import") openImport(); else demoAct(a.dataset.act); return; }
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){ closeDrawer(); closeModal(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeDrawer(); closeModal(); } });
$("#q").addEventListener("input", e=>{ const q=e.target.value.trim().toLowerCase(); if(q.length<2) return; const v=DATA.vehicles.find(x=>x.vin.toLowerCase().endsWith(q)||x.vin.toLowerCase()===q); if(v){openDrawer("vehicle",v.id);return;} const r=DATA.rentals.find(x=>x.id.toLowerCase()===q); if(r){openDrawer("rental",r.id);return;} if(q.length>=3){ const c=DATA.customers.find(x=>x.name.toLowerCase().includes(q)); if(c) openDrawer("customer",c.id); } });

function setTitle(t,s){ $("#title").textContent=t; $("#subtitle").textContent=s||""; }

function render(){
  const el = $("#view");
  if(view==="today") el.innerHTML = renderToday();
  if(view==="fleet") el.innerHTML = renderFleet();
  if(view==="rentals") el.innerHTML = renderRentals();
  if(view==="payments") el.innerHTML = renderPayments();
  if(view==="customers") el.innerHTML = renderCustomers();
  if(view==="sales") el.innerHTML = renderSales();
  if(view==="service") el.innerHTML = renderService();
  if(view==="messages") el.innerHTML = renderMessages();
}

/* ---------- Сегодня ---------- */
function renderToday(){
  setTitle("Сегодня", "суббота, 13 сентября 2026");
  const s = DATA.summary, vc = s.vehicles;
  const dueSoon = active.filter(r=>r.next_invoice && days(s.today, r.next_invoice)<=3).sort((a,b)=>a.next_invoice.localeCompare(b.next_invoice));
  const overdueSum = overdue.reduce((a,r)=>a+r.residual,0);
  return `
  <div class="tiles">
    <button class="tile" data-v="fleet"><span class="k">Парк</span><span class="v">${DATA.vehicles.length}</span><span class="d">${vc.available} свободны · ${vc.rented} в аренде · ${vc.service} в сервисе</span></button>
    <button class="tile ok" data-v="rentals"><span class="k">Активных аренд</span><span class="v">${active.length}</span><span class="d">${noVin.length} без подтверждённого VIN</span></button>
    <button class="tile crit" data-v="rentals" data-f="rentals:overdue"><span class="k">Просрочки</span><span class="v">${overdue.length}</span><span class="d">${fmt(overdueSum)} по активным арендам</span></button>
    <button class="tile warn" data-v="payments"><span class="k">Платежи без имени</span><span class="v">${unmatchedNote}</span><span class="d">эквайринг, требуют разбора</span></button>
    <button class="tile" data-v="customers"><span class="k">Залоги на руках</span><span class="v">${fmt0(s.deposits)}</span><span class="d">обязательство, не выручка</span></button>
    <button class="tile" data-v="payments"><span class="k">Дебиторка</span><span class="v">${fmt0(s.receivable)}</span><span class="d">по ${s.invoices} счетам</span></button>
  </div>
  <div class="grid2">
    <div class="card"><h3>Просрочки по аренде <span>${overdue.length}</span></h3><div class="rows">
      ${overdue.map(r=>`<button class="row" data-open="rental" data-id="${r.id}"><span class="t">${short(r.customer)}</span><span class="s">${r.id} · ${r.vin?vbrief(r.vin):"VIN не подтверждён"} · тариф ${r.rate} ₾/нед</span><span class="r crit">${fmt(r.residual)}</span></button>`).join("")}
    </div></div>
    <div class="card"><h3>Счета на ближайшие 3 дня <span>${dueSoon.length}</span></h3><div class="rows">
      ${dueSoon.length?dueSoon.map(r=>`<button class="row" data-open="rental" data-id="${r.id}"><span class="t">${short(r.customer)}</span><span class="s">${dd(r.next_invoice)} · ${r.id} · напоминание в WhatsApp за день</span><span class="r">${fmt0(r.rate)}</span></button>`).join(""):`<div class="empty">Нет счетов в ближайшие 3 дня</div>`}
    </div></div>
    <div class="card"><h3>Парк по состояниям</h3>
      <div style="padding:14px 16px 0"><div class="bar"><i style="width:${vc.available/DATA.vehicles.length*100}%;background:var(--accent)"></i><i style="width:${vc.rented/DATA.vehicles.length*100}%;background:var(--info)"></i><i style="width:${vc.service/DATA.vehicles.length*100}%;background:var(--warn)"></i></div></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Свободны ${vc.available}</span><span><i style="background:var(--info)"></i>В аренде ${vc.rented}</span><span><i style="background:var(--warn)"></i>В сервисе ${vc.service}</span></div>
      <div class="rows">${modelRows()}</div>
    </div>
    <div class="card"><h3>Требует решения <span>${noVin.length+2}</span></h3><div class="rows">
      ${noVin.map(r=>`<button class="row" data-open="rental" data-id="${r.id}"><span class="t">${short(r.customer)}</span><span class="s">${r.id} · аренда активна, мопед не привязан</span><span class="r warn">VIN?</span></button>`).join("")}
      <button class="row" data-open="rental" data-id="S00028"><span class="t">Реваз Кулдонашвили</span><span class="s">S00028 · спорная: нет ни одного платежа, дата возврата не подтверждена</span><span class="r crit">спор</span></button>
      <button class="row" data-open="rental" data-id="S00040"><span class="t">Бачана Заалишвили</span><span class="s">S00040 · спорная: реальный долг 240 ₾, счёт завышен</span><span class="r crit">спор</span></button>
    </div></div>
  </div>`;
}
function vbrief(vin){ const v=vByVin[vin]; return v?`${v.model} …${vin.slice(-4)}`:vin; }
function modelRows(){
  const m = {}; DATA.vehicles.forEach(v=>{ m[v.model]=m[v.model]||{available:0,rented:0,service:0}; m[v.model][v.status]++; });
  return Object.entries(m).sort((a,b)=>(b[1].available+b[1].rented+b[1].service)-(a[1].available+a[1].rented+a[1].service)).map(([k,c])=>`<button class="row" data-v="fleet" data-f="model:${k}"><span class="t">${k}</span><span class="s">${c.available} свободны · ${c.rented} в аренде · ${c.service} в сервисе</span><span class="r">${c.available+c.rented+c.service}</span></button>`).join("");
}

/* ---------- Парк ---------- */
function renderFleet(){
  const f = filters.fleet;
  let list = DATA.vehicles.filter(v=>(!f.status||v.status===f.status)&&(!f.model||v.model===f.model));
  const models = [...new Set(DATA.vehicles.map(v=>v.model))];
  setTitle("Парк", `${list.length} из ${DATA.vehicles.length} мопедов`);
  return `
  <div class="toolbar">
    <div class="chips">${["available","rented","service"].map(s=>`<button class="chip ${f.status===s?"on":""}" data-f="status:${s}">${ST[s]}<span class="n">${DATA.vehicles.filter(v=>v.status===s).length}</span></button>`).join("")}</div>
    <div class="chips">${models.map(m=>`<button class="chip ${f.model===m?"on":""}" data-f="model:${m}">${m}<span class="n">${DATA.vehicles.filter(v=>v.model===m).length}</span></button>`).join("")}</div>
    <span class="sp"></span>
    <button class="btn" data-act="Сканировать VIN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M7 9v6M11 9v6M15 9v6"/></svg>Сканировать VIN</button>
  </div>
  <div class="fleetgrid">${list.map(v=>{
    const r = v.rental?byId[v.rental]:null;
    return `<button class="vcard" data-open="vehicle" data-id="${v.id}"><span class="m">${v.model}<small>${v.year} · ${v.color||""}</small></span>${vinHtml(v.vin)}<span>${st(v.status)}</span><span class="who">${r?`${short(r.customer)} · до ${dd(r.next_invoice)}`:(v.driver?short(v.driver):(v.status==="service"?"в ремонте, заявка не заведена":"на складе"))}</span></button>`;}).join("")}</div>`;
}

/* ---------- Аренды ---------- */
function renderRentals(){
  const t = filters.rentals;
  let list = DATA.rentals.slice();
  if(t==="active") list = active; else if(t==="overdue") list = overdue; else if(t==="returned") list = DATA.rentals.filter(r=>r.status!=="active");
  list = list.slice().sort((a,b)=>(b.start||"").localeCompare(a.start||""));
  setTitle("Аренды", `${list.length} ${t==="all"?"всего":t==="active"?"активных":t==="overdue"?"с просрочкой":"завершённых и спорных"}`);
  return `
  <div class="toolbar">
    <div class="chips">${[["active","Активные",active.length],["overdue","Просрочка",overdue.length],["returned","Завершённые",DATA.rentals.length-active.length],["all","Все",DATA.rentals.length]].map(([k,l,n])=>`<button class="chip ${t===k?"on":""}" data-f="rentals:${k}">${l}<span class="n">${n}</span></button>`).join("")}</div>
    <span class="sp"></span>
    <button class="btn pri" data-act="Новая аренда"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Новая аренда</button>
  </div>
  <div class="tblw"><table><thead><tr><th>№</th><th>Клиент</th><th>Мопед</th><th class="num">Тариф</th><th>Выдача</th><th>${t==="active"||t==="overdue"?"Следующий счёт":"Возврат"}</th><th class="num">Долг</th><th>Статус</th></tr></thead><tbody>
  ${list.map(r=>`<tr data-open="rental" data-id="${r.id}"><td class="mono">${r.id}</td><td>${short(r.customer)}</td><td>${r.vin?`${vByVin[r.vin]?vByVin[r.vin].model+" ":""}${vinHtml(r.vin)}`:'<span class="muted">не привязан</span>'}</td><td class="num">${r.rate?r.rate+" ₾/нед":"—"}</td><td>${dd(r.start)}</td><td>${dd(r.status==="active"?r.next_invoice:r.end)}</td><td class="num" style="${r.residual>0.05?"color:var(--crit)":""}">${r.residual>0.05?fmt(r.residual):"—"}</td><td>${r.status==="active"&&r.residual>0.05?st("overdue"):st(r.status)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ---------- Платежи ---------- */
function renderPayments(){
  const m = filters.payments;
  const months = [...new Set(custPays.map(p=>p.date.slice(0,7)))].sort().reverse();
  let list = custPays.filter(p=>m==="all"||p.date.startsWith(m)).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const sum = list.reduce((a,p)=>a+p.amount,0);
  setTitle("Платежи", `${list.length} входящих · ${fmt(sum)}`);
  return `
  <div class="tiles">

function drawerVehicle(v){

  const hist = v.history.map(id=>byId[id]).filter(Boolean).sort((a,b)=>(b.start||"").localeCompare(a.start||""));

    ${v.status==="rented"&&!cur?`<div class="note">Водитель проставлен во Fleet, но активная аренда не привязана к этому VIN. Требование RNT‑06: привязать или снять.</div>`:""}

    <div class="sec"><h4>История</h4><div class="tl">
      ${hist.map(r=>`<div class="${r.status==="active"?"ok":""}"><div class="d">${dd(r.start)} → ${r.status==="active"?"сейчас":dd(r.end)}</div>${short(r.customer)} · ${r.rate} ₾/нед · залог ${fmt0(r.deposit)} · <button class="muted" style="text-decoration:underline" data-open="rental" data-id="${r.id}">${r.id}</button></div>`).join("")}
      ${sale?`<div class="bad"><div class="d">${dd(sale.date)}</div>Продан: ${short(sale.customer)} · ${fmt(sale.total)} · ${sale.id}${v.status!=="sold"?" · затем выкуплен обратно":""}</div>`:""}
      <div><div class="d">${dd(v.acquired)}</div>Приход по CMR, контракт Flybrother ZJQXGLJY0012024</div>
    </div></div>
  </div>`;
}

function drawerRental(r){
  if(!r) return "";
  const v = r.vin?vByVin[r.vin]:null;
  const periods = r.invoices.slice().sort((a,b)=>a.date.localeCompare(b.date));

  return dhead(`Аренда · ${r.id}`, short(r.customer), `${v?v.model+" · ":""}${r.vin?vinHtml(r.vin):"VIN не подтверждён"}`) + `<div class="db">

    ${r.id==="S00017"?`<div class="note ok">Условие выкупа: 130 ₾ из каждого платежа идут в счёт 4 700 ₾ (RNT‑07).</div>`:""}
    ${!r.vin&&r.status==="active"?`<div class="note">Мопед не привязан: VIN в договоре нечитаем или договора нет. Аренда в списке «Требует решения».</div>`:""}
    <div class="actions">${r.status==="active"?`<button class="btn pri" data-act="Оформить возврат">Оформить возврат</button><button class="btn" data-act="Напомнить в WhatsApp">Напомнить в WhatsApp</button><button class="btn" data-act="Принять наличные">Наличные</button>`:`<button class="btn" data-act="Открыть договор">Договор PDF</button>`}</div>

    </div></div>
    <div class="sec"><h4>Клиент</h4><button class="btn" data-open="customer" data-id="${r.customer_id}">Открыть карточку клиента</button></div>
  </div>`;
}

function drawerCustomer(c){
  if(!c) return "";
  const rs = c.rentals.map(id=>byId[id]).filter(Boolean).sort((a,b)=>(b.start||"").localeCompare(a.start||""));
  const ss = DATA.sales.filter(s=>c.sales.includes(s.id));
  const pays = custPays.filter(p=>p.partner_id===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const owed = rs.reduce((a,r)=>a+r.residual,0)+ss.reduce((a,s)=>a+s.residual,0);
  const dep = rs.filter(r=>r.status==="active").reduce((a,r)=>a+r.deposit,0);
  return dhead("Клиент", short(c.name), c.name.includes("/")?c.name.split("/")[0].trim():"") + `<div class="db">
    <div class="kv"><b>WhatsApp</b><span class="mono">${c.phone||'<span class="muted">номера нет</span>'}</span><b>Теги</b><span>${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")||"—"}</span><b>Оплачено</b><span>${fmt(c.paid)} · ${c.payments} платежей</span><b>Долг</b><span style="${owed>0.05?"color:var(--crit)":""}">${owed>0.05?fmt(owed):"нет"}</span><b>Залог на руках</b><span>${dep?fmt0(dep):"—"}</span></div>
    <div class="actions"><button class="btn" data-act="Написать в WhatsApp">Написать в WhatsApp</button><button class="btn" data-act="Документы">Документы</button></div>
    ${rs.length?`<div class="sec"><h4>Аренды</h4><div class="rows">${rs.map(r=>`<button class="row" data-open="rental" data-id="${r.id}"><span class="t">${r.id} · ${r.vin?vbrief(r.vin):"VIN?"}</span><span class="s">${dd(r.start)} → ${r.status==="active"?"сейчас":dd(r.end)} · ${r.rate} ₾/нед</span><span class="r ${r.residual>0.05?"crit":""}">${r.residual>0.05?fmt(r.residual):st(r.status)}</span></button>`).join("")}</div></div>`:""}
    ${ss.length?`<div class="sec"><h4>Покупки</h4><div class="rows">${ss.map(s=>`<div class="row"><span class="t">${s.items.map(i=>i.replace(" - Sale","")).join(", ")} ${s.vin?vinHtml(s.vin):""}</span><span class="s">${dd(s.date)} · ${s.id} · гарантия до ${dd(addYear(s.date))}</span><span class="r ${s.residual>0.05?"crit":""}">${s.residual>0.05?"−"+fmt(s.residual):fmt(s.total)}</span></div>`).join("")}</div></div>`:""}
    <div class="sec"><h4>Платежи <span class="muted" style="text-transform:none;letter-spacing:0">(${pays.length})</span></h4><div class="periods">${pays.slice(0,14).map(p=>`<div class="period"><span><span class="n">${dd(p.date)}</span> · <span class="muted">${p.memo.slice(0,60)}</span></span><span></span><span class="money">${fmt(p.amount)}</span></div>`).join("")||`<div class="muted">Платежей по выпискам нет</div>`}${pays.length>14?`<div class="muted" style="font-size:12.5px">ещё ${pays.length-14}</div>`:""}</div></div>
  </div>`;
}
