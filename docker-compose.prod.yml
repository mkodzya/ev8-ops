# The server stack. Not the laptop one.
#
# `docker-compose.yml` is the laptop stack: it publishes Postgres and the API
# so you can reach them with psql and curl, it accepts the development session
# secret, and it can seed a demo dataset. Every one of those is wrong on a
# machine facing the internet, and none of them announce themselves — which is
# why this is a separate file rather than a few overrides. The shape is Self
# Platform's, so one server is operated one way (practices §2).
#
# What is different here, and why:
#   · Postgres and the API publish NOTHING. On a laptop `ports: 5432` reaches
#     your own machine; on a VPS it reaches the internet, and the laptop's
#     credentials are ev8ops/ev8ops in a file in this repository.
#   · The web tier is Caddy serving a built bundle, not `vite preview`.
#   · Nothing has a fallback that could be wrong. Compose refuses to start if
#     a required value is missing, and says which one.
#   · SEED_MODE is blank and ALLOW_DEV_SECRET is absent: a weak secret stops
#     the boot, and the demo dataset — which carries logins whose password is
#     published in this repository — cannot run at all.
#
# Run it with an explicit project name so prod and test share one machine:
#   docker compose -p ev8-prod --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The web port is published on 127.0.0.1 only: the edge proxy that terminates
# TLS reaches it over the loopback, and nothing else can.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports. The API reaches it over the compose network by name; psql and
    # the backup go through `docker compose exec`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # No ALLOW_DEV_SECRET here at all: a weak secret stops the boot instead
      # of quietly signing sessions with a string published in this
      # repository. Generate both with `openssl rand -base64 48`.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.prod — openssl rand -base64 48}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env.prod — openssl rand -base64 48}
      NODE_ENV: production
      API_PORT: "8080"
      TZ: ${TZ:-Asia/Tbilisi}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ka}
      # The first owner login, and only while the database is empty. Mika
      # chooses this password and nobody else sees it; once he has signed in
      # the line is emptied, so this one is deliberately not required — an
      # empty value must not stop a stand that has had users for months. When
      # it is genuinely needed, on an empty database, the seed says so and
      # refuses to invent a default.
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env.prod}
      OWNER_NAME: ${OWNER_NAME:?set OWNER_NAME in .env.prod}
      OWNER_PASSWORD: ${OWNER_PASSWORD-}
      # Blank, always. The demo dataset's logins share a password that is in
      # this repository, and `demo.director@ev8.test` is an owner.
      SEED_MODE: ""
      # The public site's queue request goes to this mailbox by email
      # (/api/site/queue). Optional on purpose: with any of the first three
      # blank the route answers 503 and the site keeps its WhatsApp button.
      # The password is an app password made for this alone — never the
      # mailbox's own — and only Mika writes it into .env.prod / .env.test.
      SITE_MAIL_HOST: ${SITE_MAIL_HOST-}
      SITE_MAIL_PORT: ${SITE_MAIL_PORT:-465}
      SITE_MAIL_USER: ${SITE_MAIL_USER-}
      SITE_MAIL_PASSWORD: ${SITE_MAIL_PASSWORD-}
      SITE_MAIL_TO: ${SITE_MAIL_TO-}
      # The Kommo link (ADR-0012): the API asks Kommo who is renting and says
      # where that differs from the rentals here. Optional on purpose: with
      # no token the link is off and no screen mentions it. The token is a
      # long-lived one of a private integration; only Mika issues it, and it
      # reaches this file's env through deploy/set-kommo-token.sh — never
      # through a session, a commit or a log. The other three are blank
      # unless the account changes: the address and the ids of the rental
      # pipeline and its "rented" stage have their defaults in one place,
      # apps/api/src/lib/kommo.ts.
      KOMMO_TOKEN: ${KOMMO_TOKEN-}
      KOMMO_BASE_URL: ${KOMMO_BASE_URL-}
      KOMMO_RENTAL_PIPELINE_ID: ${KOMMO_RENTAL_PIPELINE_ID-}
      KOMMO_RENTED_STATUS_ID: ${KOMMO_RENTED_STATUS_ID-}
      # A deal closed as won in the sales pipeline comes in as a task too
      # (ADR-0015); blank unless the pipeline is re-made in Kommo.
      KOMMO_SALES_PIPELINE_ID: ${KOMMO_SALES_PIPELINE_ID-}
      # Bank of Georgia statements by its Business Online API (B11-03). Optional
      # on purpose: with no keys the link is off and statements come only as
      # uploaded files. The keys are issued by the company in Business Online,
      # answer only this server's address and reach this file's env through
      # deploy/set-bog-keys.sh — never through a session, a commit or a log.
      # BOG_ACCOUNT is a list, apart by commas, of the accounts read: each as
      # the bank writes it in a statement file, bare for lari (GE…BG…) and with
      # USD or EUR after the number for an account in dollars or euros, read
      # apart and outside every sum in lari (ADR-0051); the same IBAN in two
      # currencies is two accounts. Any other currency stops the link. An
      # account in another currency joins the list with
      # `set-bog-keys.sh --add-account`, which asks the bank first. Blank, the
      # account named in the last Bank of Georgia statement uploaded here is
      # asked about, in lari. The numbers are not written in this repository.
      BOG_CLIENT_ID: ${BOG_CLIENT_ID-}
      BOG_CLIENT_SECRET: ${BOG_CLIENT_SECRET-}
      BOG_ACCOUNT: ${BOG_ACCOUNT-}
      # TBC statements by its Business Integration Services (B11-03, ADR-0026),
      # the same way: optional, off without keys. The keys are issued by the
      # company in Business Internet Banking (API Integration, the permission
      # to view transaction history and statements only) and reach this file's
      # env through deploy/set-tbc-keys.sh. TBC_ACCOUNT is a list of TBC
      # accounts (GE…TB…) the same way as BOG_ACCOUNT: bare for lari, USD or
      # EUR after the number for dollars or euros (`--add-account`); blank,
      # the account named in the last TBC statement uploaded here, in lari.
      # TBC_BASE_URL is blank for the bank itself; its test environment,
      # https://test-api.tbcbank.ge, takes only the test keys of its portal.
      TBC_CLIENT_ID: ${TBC_CLIENT_ID-}
      TBC_CLIENT_SECRET: ${TBC_CLIENT_SECRET-}
      TBC_ACCOUNT: ${TBC_ACCOUNT-}
      TBC_BASE_URL: ${TBC_BASE_URL-}
      # The rentals folders in Google Drive, read only (ADR-0031): the service
      # account's JSON key and the shared folder, put in the stand's env file
      # by deploy/set-drive-key.sh. Blank — the link is off.
      DRIVE_SA_KEY: ${DRIVE_SA_KEY-}
      DRIVE_ROOT: ${DRIVE_ROOT-}
      # The notices to the workshop's Telegram group (ADR-0038 §6–7): the API
      # only sends — no webhook, no updates. Optional on purpose: without the
      # bot's token or the group the notices wait and nothing is sent. Mika
      # registers the bot himself and writes both, with this stand's own
      # address for the links under each notice (PUBLIC_URL), through
      # deploy/set-telegram.sh — never through a session, a commit or a log.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID-}
      PUBLIC_URL: ${PUBLIC_URL-}
      # The translator of typed texts about mopeds and repairs (ADR-0042):
      # Claude, through Anthropic's API. Optional on purpose: without the key
      # nothing is sent and every screen shows the originals. Mika creates the
      # key in his own Anthropic account and writes it through
      # deploy/set-anthropic-key.sh — never through a session, a commit or a
      # log. The model (claude-haiku-5-5 when blank) and the texts a day
      # (500 when blank) change without a release.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL-}
      TRANSLATE_DAILY_LIMIT: ${TRANSLATE_DAILY_LIMIT-}
    # No ports either. The browser reaches /api through the web container,
    # which is the same origin the page came from.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      WORKER_TOKEN: ${WORKER_TOKEN}
      # Rental weeks are rolled just after midnight, in the company's zone.
      PERIODS_CRON: ${PERIODS_CRON:-10 0 * * *}
      # Kommo is asked every five minutes; the account's plan has no webhooks.
      KOMMO_CRON: ${KOMMO_CRON:-*/5 * * * *}
      # Bank of Georgia: the day's operations every five minutes — 288 a day
      # for each account and currency, of the 800 the bank allows each of them
      # (another page of its documentation says 10 000; ADR-0051), and the test
      # stand asks about the same accounts with the same keys — the full
      # statement once a night: asked every hour, read by the first that finds
      # yesterday unread.
      BOG_CRON: ${BOG_CRON:-*/5 * * * *}
      BOG_NIGHT_CRON: ${BOG_NIGHT_CRON:-17 * * * *}
      # TBC: two minutes after each Bank of Georgia pull, its night half an hour off.
      TBC_CRON: ${TBC_CRON:-2-59/5 * * * *}
      TBC_NIGHT_CRON: ${TBC_NIGHT_CRON:-47 * * * *}
      # The rentals folders in Drive, once a night (ADR-0031).
      DRIVE_CRON: ${DRIVE_CRON:-23 3 * * *}
      # The Telegram notices: what did not go, every minute; mopeds due for
      # maintenance and parts below the minimum, looked for hourly from 09:00
      # to 20:00 — the group is not woken at night (ADR-0038 §6).
      NOTICES_CRON: ${NOTICES_CRON:-* * * * *}
      NOTICES_SCAN_CRON: ${NOTICES_SCAN_CRON:-0 9-20 * * *}
      # Typed texts listed and translated, every minute (ADR-0042).
      TRANSLATE_CRON: ${TRANSLATE_CRON:-* * * * *}
      TZ: ${TZ:-Asia/Tbilisi}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      # Loopback only. TLS and the hostname belong to the edge proxy; this
      # port is how it reaches this stack, and it is not reachable from
      # outside the machine. Two stacks on one host differ only by this number.
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
