# Reference copy of .github/workflows/deploy.yml for mkodzya/ev8-site — the
# other half of deploy/site-receive.sh. It lives here until it is committed in
# the site repository. Checked against that repository on 11.10.2026:
# astro.config.mjs reads SITE_BASE (default "/"), scripts/build.sh sets
# PREVIEW=1 for the preview build, and `npm run check` is its i18n guard.
#
# develop → test.ops.ev8.ge/garage/site/ (built with base /garage/site/)
# main    → ev8.ge                       (built with base /)
#
# So a merge into main IS the release of the site: main stays Mika's, as the
# site repository's CLAUDE.md already says.
#
# Secrets in mkodzya/ev8-site, set by deploy/site-deploy-setup.sh:
#   SITE_DEPLOY_KEY          private key of ev8site@204.168.149.105
#   SITE_DEPLOY_KNOWN_HOSTS  that server's host key
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# One deploy per branch at a time, in order; a second push waits, it does not
# cancel the one that is shipping.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      SITE_BASE: ${{ github.ref_name == 'main' && '/' || '/garage/site/' }}
      # The preview build is marked noindex by the site itself.
      PREVIEW: ${{ github.ref_name == 'main' && '' || '1' }}
      ASTRO_TELEMETRY_DISABLED: '1'
      CHECK_URL: ${{ github.ref_name == 'main' && 'https://ev8.ge/' || 'https://test.ops.ev8.ge/garage/site/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Ship to the server
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -o BatchMode=yes ev8site@204.168.149.105 "$TARGET"
      - name: Check it answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$CHECK_URL")
          echo "$CHECK_URL → $code"
          # 401: the preview is behind its login (deploy/set-site-password.sh).
          case "$code" in 200 | 401) ;; *) exit 1 ;; esac
